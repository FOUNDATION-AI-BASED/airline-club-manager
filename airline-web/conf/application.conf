play.crypto.secret = "Afrbjgko0Wz2G2gdI16hUOGE1VHuvCbFfMy1pTWtHPyx4s1Q17Gv7FeHfwXr8ymW"
play.http.secret.key = "Afrbjgko0Wz2G2gdI16hUOGE1VHuvCbFfMy1pTWtHPyx4s1Q17Gv7FeHfwXr8ymW"


# The application languages
# ~~~~~
play.i18n.langs = [ "en" ]

# Router
# ~~~~~
# Define the Router object to use for this application.
# This router will be looked up first when the application is starting up,
# so make sure this is the entry point.
# Furthermore, it's assumed your route file is named properly.
# So for an application router like `my.application.Router`,
# you may need to define a router file `conf/my.application.routes`.
# Default to Routes in the root package (and conf/routes)
# play.http.router = my.application.Routes

# Database configuration
# ~~~~~
# You can declare as many datasources as you want.
# By convention, the default datasource is named `default`
#
db.default.driver=com.mysql.cj.jdbc.Driver
db.default.url="jdbc:mysql://127.0.0.1:3306/airline_v2_1?characterEncoding=UTF-8"
db.default.username=sa
db.default.password=testmysql

# Evolutions
# ~~~~~
# You can disable evolutions if needed
play.evolutions.enabled=true

# You can disable evolutions for a specific datasource if necessary
# play.evolutions.db.default.enabled=false

# Artery Reference: https://pekko.apache.org/docs/pekko/current/remoting-artery.html
pekko {
  actor {
    provider = remote
    allow-java-serialization = on
    warn-about-java-serializer-usage = false
  }
  remote {
    artery {
      transport = tcp
      canonical {
        hostname = "192.168.50.15"
        port = 0
      }
    }
  }
}

websocketActorSystem {
  pekko {
    actor {
      provider = remote
      allow-java-serialization = on
      warn-about-java-serializer-usage = false
    }
    remote {
      artery {
        transport = tcp
        canonical {
          hostname = "192.168.50.15" #your private IP here
          port = 10999
        }
        bind {
          hostname = "192.168.50.15" #your private IP here
          port = 10999
        }
      }
     
    }
  }
}

my-pinned-dispatcher {
  executor = "thread-pool-executor"
  type = PinnedDispatcher
}

mysqldb.host="127.0.0.1:3306"
sim.pekko-actor.host="127.0.0.1:2552"
google.mapKey="test99"
google.apiKey="test992"

play.allowGlobalApplication = true

play.filters.disabled += "play.filters.csrf.CSRFFilter"
play.filters.enabled += "play.filters.gzip.GzipFilter"
play.filters.hosts {
  allowed = ["."]
}

play.filters.gzip {
 contentType {

    # If non empty, then a response will only be compressed if its content type is in this list.
    whiteList = [ "text/*", "application/javascript", "application/json" ]

    # The black list is only used if the white list is empty.
    # Compress all responses except the ones whose content type is in this list.
    blackList = []
  }
}

bannerEnabled = false

mysqldb.user="sa"

mysqldb.password="testmysql"

mysqldb.dbParams="&allowPublicKeyRetrieval=true"
